<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 588" width="440" height="588" font-family="'Atkinson Hyperlegible Next Variable', system-ui, sans-serif" font-size="17" fill="#10283a">
  <!-- Two boxes that look different -->
  <path d="M40 40 L58 24 H168 L150 40 Z" fill="#eef6fa" stroke="#073f6e" stroke-width="2" stroke-linejoin="round"/>
  <path d="M150 40 L168 24 V110 L150 126 Z" fill="#d5e2ea" stroke="#073f6e" stroke-width="2" stroke-linejoin="round"/>
  <rect x="40" y="40" width="110" height="86" fill="#dcebf3" stroke="#073f6e" stroke-width="2"/>
  <circle cx="74" cy="83" r="13" fill="#ffffff" stroke="#46586a" stroke-width="2"/>
  <circle cx="116" cy="83" r="13" fill="#ffffff" stroke="#46586a" stroke-width="2"/>
  <line x1="66" y1="83" x2="82" y2="83" stroke="#46586a" stroke-width="2"/>
  <line x1="108" y1="83" x2="124" y2="83" stroke="#46586a" stroke-width="2"/>
  <text x="104" y="156" text-anchor="middle" font-weight="700">Médicament d'origine</text>

  <rect x="262" y="58" width="150" height="68" rx="14" fill="#e6f7ef" stroke="#0b6b45" stroke-width="2"/>
  <g stroke="#10283a" stroke-width="2">
    <path d="M296 80 H312 V104 H296 a12 12 0 0 1 0 -24 Z" fill="#e7b03b"/>
    <path d="M312 80 H320 a12 12 0 0 1 0 24 H312 Z" fill="#ffffff"/>
    <path d="M352 80 H368 V104 H352 a12 12 0 0 1 0 -24 Z" fill="#e7b03b"/>
    <path d="M368 80 H376 a12 12 0 0 1 0 24 H368 Z" fill="#ffffff"/>
  </g>
  <text x="337" y="156" text-anchor="middle" font-weight="700">Générique</text>

  <!-- What is the same, what may change -->
  <rect x="16" y="180" width="408" height="64" rx="10" fill="#eef6fa"/>
  <circle cx="44" cy="212" r="15" fill="#073f6e"/>
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <line x1="37" y1="207" x2="51" y2="207"/><line x1="37" y1="217" x2="51" y2="217"/>
  </g>
  <text x="72" y="206" font-weight="700">Identique</text>
  <text x="72" y="230">la substance active, en même quantité</text>

  <rect x="16" y="256" width="408" height="64" rx="10" fill="#ffffff" stroke="#46586a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g fill="none" stroke="#46586a" stroke-width="2">
    <circle cx="37" cy="283" r="6"/><rect x="45" y="277" width="11" height="11"/><path d="M38 302 L44 292 L50 302 Z"/>
  </g>
  <text x="72" y="282" font-weight="700">Peut changer</text>
  <text x="72" y="306" font-size="16">taille, forme, couleur, goût, excipients</text>

  <!-- Bioequivalence: two curves very close, not identical -->
  <text x="60" y="358" font-size="16" fill="#46586a">Quantité dans le sang</text>
  <g stroke="#46586a" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M60 368 V494 H420"/>
  </g>
  <text x="420" y="518" text-anchor="end" font-size="16" fill="#46586a">Temps</text>
  <path d="M60 492 C92 404 128 384 160 384 C214 384 290 444 420 480" fill="none" stroke="#073f6e" stroke-width="4"/>
  <path d="M60 492 C96 412 134 392 168 392 C222 392 294 450 420 484" fill="none" stroke="#0b6b45" stroke-width="3" stroke-dasharray="9 7"/>

  <line x1="60" y1="544" x2="96" y2="544" stroke="#073f6e" stroke-width="4"/>
  <text x="106" y="550" font-size="16">Médicament d'origine</text>
  <line x1="60" y1="572" x2="96" y2="572" stroke="#0b6b45" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="106" y="578" font-size="16">Générique : courbe très proche</text>
</svg>
