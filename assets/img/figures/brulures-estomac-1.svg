<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" width="440" height="340" font-family="'Atkinson Hyperlegible Next Variable', system-ui, sans-serif" font-size="16" fill="currentColor">
  <defs>
    <pattern id="brulures-estomac-1-radeau" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      
      <path d="M0 0 V6" stroke="#0b6b45" stroke-width="2.5"/>
    </pattern>
    <clipPath id="brulures-estomac-1-dedans">
      <path d="M100 96 C56 104 34 156 44 206 C54 258 120 286 172 264 C214 246 224 206 204 176 C188 152 152 150 134 122 L126 96 Z"/>
    </clipPath>
  </defs>

  <!-- Oesophagus and stomach -->
  <path d="M100 12 V96 M126 12 V96" stroke="#10283a" stroke-width="2.5"/>
  <text x="16" y="40" fill="#46586a">Œsophage</text>
  <path d="M100 96 C56 104 34 156 44 206 C54 258 120 286 172 264 C214 246 224 206 204 176 C188 152 152 150 134 122 L126 96 Z" fill="#ffffff"/>
  <g clip-path="url(#brulures-estomac-1-dedans)">
    <rect x="30" y="186" width="200" height="110" fill="#bfe3ee"/>
    <rect x="30" y="172" width="200" height="16" fill="#e6f7ef"/>
    <rect x="30" y="172" width="200" height="16" fill="url(#brulures-estomac-1-radeau)" stroke="#0b6b45" stroke-width="2"/>
  </g>
  <path d="M100 96 C56 104 34 156 44 206 C54 258 120 286 172 264 C214 246 224 206 204 176 C188 152 152 150 134 122 L126 96 Z" fill="none" stroke="#10283a" stroke-width="2.5"/>
  <text x="70" y="140" fill="#46586a">Estomac</text>

  <!-- Antacid: grains in the acid -->
  <g fill="#ffffff" stroke="#10283a" stroke-width="1.8">
    <circle cx="96" cy="216" r="5"/><circle cx="124" cy="232" r="5"/><circle cx="150" cy="212" r="5"/><circle cx="110" cy="250" r="5"/><circle cx="168" cy="236" r="5"/>
  </g>
  <!-- PPI: pumps of the wall, slowed -->
  <g fill="#073f6e">
    <rect x="44" y="214" width="10" height="10" transform="rotate(-20 49 219)"/>
    <rect x="66" y="252" width="10" height="10" transform="rotate(-40 71 257)"/>
    <rect x="200" y="196" width="10" height="10" transform="rotate(30 205 201)"/>
  </g>

  <!-- Labels -->
  <g stroke="#46586a" stroke-width="1.5">
    <line x1="206" y1="180" x2="246" y2="70"/>
    <line x1="172" y1="236" x2="246" y2="168"/>
    <line x1="212" y1="204" x2="246" y2="262"/>
  </g>
  <rect x="252" y="40" width="22" height="12" fill="url(#brulures-estomac-1-radeau)" stroke="#0b6b45" stroke-width="1.5"/>
  <text x="282" y="52" font-weight="700">Alginate</text>
  <text x="252" y="76">une couche qui flotte</text>
  <text x="252" y="96">et protège l'œsophage</text>
  <circle cx="263" cy="146" r="6" fill="#ffffff" stroke="#10283a" stroke-width="1.8"/>
  <text x="282" y="152" font-weight="700">Antiacide</text>
  <text x="252" y="176">neutralise l'acide</text>
  <text x="252" y="196">déjà dans l'estomac</text>
  <rect x="257" y="236" width="12" height="12" fill="#073f6e"/>
  <text x="282" y="248" font-weight="700">IPP</text>
  <text x="252" y="272">l'estomac fabrique</text>
  <text x="252" y="292">moins d'acide</text>
  <text x="16" y="326" fill="#46586a">Schéma sans échelle.</text>
</svg>
