<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 532" width="440" height="532" font-family="'Atkinson Hyperlegible Next Variable', system-ui, sans-serif" font-size="17" fill="currentColor">
  <defs>
    <marker id="benefice-risque-1-fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#073f6e"/>
    </marker>
  </defs>

  <!-- The balance: the benefits weigh more -->
  <path d="M184 262 L196 246 H244 L256 262 Z" fill="#46586a"/>
  <rect x="215" y="70" width="10" height="178" fill="#46586a"/>
  <line x1="106" y1="78" x2="334" y2="54" stroke="#10283a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="220" cy="66" r="9" fill="#e7b03b" stroke="#10283a" stroke-width="2.5"/>
  <g stroke="#46586a" stroke-width="2">
    <line x1="106" y1="78" x2="40" y2="128"/><line x1="106" y1="78" x2="172" y2="128"/>
    <line x1="334" y1="54" x2="268" y2="108"/><line x1="334" y1="54" x2="400" y2="108"/>
  </g>

  <rect x="16" y="128" width="180" height="108" rx="10" fill="#e6f7ef" stroke="#0b6b45" stroke-width="2"/>
  <text x="32" y="156" font-weight="700" fill="#0b6b45">Bénéfices</text>
  <text x="32" y="182">guérir</text>
  <text x="32" y="204">soulager</text>
  <text x="32" y="226">éviter une maladie</text>

  <rect x="244" y="108" width="180" height="86" rx="10" fill="#fdf1d8" stroke="#7a4f00" stroke-width="2"/>
  <text x="260" y="136" font-weight="700" fill="#7a4f00">Risques</text>
  <text x="260" y="162">effets indésirables</text>
  <text x="260" y="184">interactions</text>

  <!-- Before and after the marketing authorisation -->
  <rect x="16" y="290" width="408" height="64" rx="10" fill="#eef6fa"/>
  <text x="32" y="316" font-weight="700">Avant l'autorisation</text>
  <text x="32" y="340" font-size="16">essais chez un nombre limité de personnes</text>

  <line x1="56" y1="356" x2="56" y2="392" stroke="#073f6e" stroke-width="2.5" marker-end="url(#benefice-risque-1-fleche)"/>
  <text x="76" y="380" font-size="16" font-weight="700" fill="#073f6e">Autorisation de mise sur le marché</text>

  <rect x="16" y="398" width="408" height="118" rx="10" fill="#ffffff" stroke="#073f6e" stroke-width="2"/>
  <text x="32" y="424" font-weight="700">Après la mise sur le marché</text>
  <text x="32" y="450" font-size="16">des milliers ou des millions</text>
  <text x="32" y="472" font-size="16">de personnes, pendant des années</text>
  <text x="32" y="500" font-weight="700" fill="#073f6e">La pesée continue</text>

  <!-- Magnifying glass over the second part -->
  <line x1="390" y1="480" x2="410" y2="502" stroke="#10283a" stroke-width="7" stroke-linecap="round"/>
  <circle cx="372" cy="460" r="26" fill="#eef6fa" stroke="#10283a" stroke-width="4"/>
  <g stroke="#46586a" stroke-width="2" fill="none">
    <line x1="358" y1="452" x2="386" y2="448"/>
    <line x1="372" y1="450" x2="372" y2="472"/>
    <path d="M352 458 a6 4 0 0 0 12 0 M380 455 a6 4 0 0 0 12 0"/>
  </g>
</svg>
