<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 556" width="440" height="556" font-family="'Atkinson Hyperlegible Next Variable', system-ui, sans-serif" font-size="16" fill="#10283a">
  <defs>
    <marker id="cystite-1-fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#073f6e"/>
    </marker>
  </defs>

  <rect x="16" y="12" width="408" height="56" rx="10" fill="#dcebf3" stroke="#073f6e" stroke-width="2"/>
  <text x="32" y="36" font-size="17" font-weight="700">Brûlures en urinant,</text>
  <text x="32" y="58" font-size="17" font-weight="700">envies fréquentes</text>
  <line x1="60" y1="68" x2="60" y2="92" stroke="#073f6e" stroke-width="2.5" marker-end="url(#cystite-1-fleche)"/>

  <rect x="16" y="96" width="408" height="62" rx="10" fill="#eef6fa" stroke="#073f6e" stroke-width="2"/>
  <text x="32" y="122" font-size="17" font-weight="700">Fièvre, douleur dans le dos,</text>
  <text x="32" y="145" font-size="17" font-weight="700">ou grossesse ?</text>

  <!-- Yes: see a doctor -->
  <line x1="320" y1="158" x2="320" y2="194" stroke="#073f6e" stroke-width="2.5" marker-end="url(#cystite-1-fleche)"/>
  <text x="330" y="182" font-weight="700" fill="#073f6e">Oui</text>
  <rect x="216" y="198" width="208" height="104" rx="10" fill="#fdeceb" stroke="#b3261e" stroke-width="2"/>
  <text x="230" y="224" font-weight="700" fill="#b3261e">Consultez un médecin</text>
  <text x="230" y="248">le jour même en cas</text>
  <text x="230" y="270">de fièvre ou de douleur</text>
  <text x="230" y="292">dans le dos</text>

  <!-- No: urine dipstick -->
  <line x1="60" y1="158" x2="60" y2="326" stroke="#073f6e" stroke-width="2.5" marker-end="url(#cystite-1-fleche)"/>
  <text x="70" y="246" font-weight="700" fill="#073f6e">Non</text>
  <rect x="16" y="330" width="408" height="48" rx="10" fill="#eef6fa" stroke="#073f6e" stroke-width="2"/>
  <text x="32" y="360" font-size="17" font-weight="700">Bandelette urinaire</text>

  <line x1="60" y1="378" x2="60" y2="414" stroke="#073f6e" stroke-width="2.5" marker-end="url(#cystite-1-fleche)"/>
  <text x="70" y="402" font-weight="700" fill="#073f6e">Positive</text>
  <rect x="16" y="418" width="196" height="126" rx="10" fill="#dcebf3" stroke="#073f6e" stroke-width="2"/>
  <text x="30" y="444" font-weight="700">Antibiotique :</text>
  <text x="30" y="468">fosfomycine,</text>
  <text x="30" y="490">en une prise</text>

  <line x1="320" y1="378" x2="320" y2="414" stroke="#073f6e" stroke-width="2.5" marker-end="url(#cystite-1-fleche)"/>
  <text x="330" y="402" font-weight="700" fill="#073f6e">Négative</text>
  <rect x="228" y="418" width="196" height="126" rx="10" fill="#ffffff" stroke="#46586a" stroke-width="2"/>
  <text x="242" y="444" font-weight="700">Avis médical</text>
  <text x="242" y="468">pour chercher</text>
  <text x="242" y="490">une autre cause</text>
</svg>
