  <path d="M8 8 H432 V206 L412 200 L392 206 L372 200 L352 206 L332 200 L312 206 L292 200 L272 206 L252 200 L232 206 L212 200 L192 206 L172 200 L152 206 L132 200 L112 206 L92 200 L72 206 L52 200 L32 206 L8 200 Z" fill="#ffffff" stroke="#46586a" stroke-width="1.5" stroke-linejoin="round"/>
