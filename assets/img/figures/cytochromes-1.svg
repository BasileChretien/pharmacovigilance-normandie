<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 744" width="440" height="744" font-family="'Atkinson Hyperlegible Next Variable', system-ui, sans-serif" font-size="16" fill="currentColor">
  <defs>
    <marker id="cytochromes-1-fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#073f6e"/>
    </marker>
    <marker id="cytochromes-1-fleche-grise" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#46586a"/>
    </marker>
  </defs>

  <!-- Gut lumen -->
  <rect x="8" y="8" width="424" height="48" rx="8" fill="#eef6fa"/>
  <text x="160" y="38" font-weight="700">Médicament dans l'intestin</text>

  <!-- Enterocyte -->
  <rect x="24" y="72" width="392" height="96" rx="14" fill="#ffffff" stroke="#46586a" stroke-width="2"/>
  <text x="404" y="96" text-anchor="end" font-weight="700">Entérocyte</text>
  <rect x="56" y="62" width="16" height="22" rx="3" fill="#dcebf3" stroke="#10283a" stroke-width="2"/>
  <path d="M140 104 H64 V46" fill="none" stroke="#46586a" stroke-width="2.5" marker-end="url(#cytochromes-1-fleche-grise)"/>
  <text x="76" y="128" font-weight="700">P-gp</text>
  <path d="M140 140 H174" stroke="#46586a" stroke-width="2.5" marker-end="url(#cytochromes-1-fleche-grise)"/>
  <rect x="180" y="126" width="88" height="28" rx="6" fill="#e7b03b"/>
  <text x="224" y="146" text-anchor="middle" font-weight="700">CYP3A4</text>
  <path d="M268 140 H298" stroke="#46586a" stroke-width="2.5" marker-end="url(#cytochromes-1-fleche-grise)"/>
  <text x="304" y="146">métabolites</text>

  <text x="152" y="192" fill="#46586a">veine porte</text>

  <!-- Hepatocyte -->
  <rect x="24" y="204" width="392" height="88" rx="14" fill="#ffffff" stroke="#46586a" stroke-width="2"/>
  <text x="404" y="228" text-anchor="end" font-weight="700">Hépatocyte</text>
  <path d="M140 262 H174" stroke="#46586a" stroke-width="2.5" marker-end="url(#cytochromes-1-fleche-grise)"/>
  <rect x="180" y="248" width="88" height="28" rx="6" fill="#e7b03b"/>
  <text x="224" y="268" text-anchor="middle" font-weight="700">CYP3A4</text>
  <path d="M268 262 H298" stroke="#46586a" stroke-width="2.5" marker-end="url(#cytochromes-1-fleche-grise)"/>
  <text x="304" y="268">métabolites</text>

  <!-- Blood -->
  <rect x="8" y="316" width="424" height="44" rx="8" fill="#fdeceb"/>
  <text x="160" y="344" font-weight="700">Sang : circulation générale</text>

  <!-- The substrate's path, drawn last so that it stays on top -->
  <path d="M140 30 V310" stroke="#073f6e" stroke-width="5" marker-end="url(#cytochromes-1-fleche)"/>
  <circle cx="140" cy="30" r="9" fill="#073f6e"/>

  <!-- With an inhibitor -->
  <rect x="8" y="380" width="424" height="92" rx="10" fill="#fdeceb"/>
  <circle cx="40" cy="426" r="19" fill="#ffffff" stroke="#b3261e" stroke-width="2"/>
  <path d="M40 437 V416 M32 423 L40 414 L48 423" fill="none" stroke="#b3261e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="72" y="406" font-weight="700">Avec un inhibiteur (CYP3A4, P-gp)</text>
  <text x="72" y="430">plus de substrat atteint le sang :</text>
  <text x="72" y="454" font-weight="700" fill="#b3261e">risque de surdosage</text>

  <!-- With an inducer -->
  <rect x="8" y="480" width="424" height="92" rx="10" fill="#eef6fa"/>
  <circle cx="40" cy="526" r="19" fill="#ffffff" stroke="#073f6e" stroke-width="2"/>
  <path d="M40 515 V536 M32 529 L40 538 L48 529" fill="none" stroke="#073f6e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="72" y="506" font-weight="700">Avec un inducteur</text>
  <text x="72" y="530">moins de substrat atteint le sang :</text>
  <text x="72" y="554" font-weight="700" fill="#073f6e">effet diminué</text>

  <!-- Prodrug: the reverse -->
  <rect x="8" y="580" width="424" height="156" rx="10" fill="#ffffff" stroke="#073f6e" stroke-width="2" stroke-dasharray="7 4"/>
  <circle cx="40" cy="640" r="19" fill="#ffffff" stroke="#073f6e" stroke-width="2"/>
  <path d="M40 629 V650 M32 643 L40 652 L48 643" fill="none" stroke="#073f6e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="72" y="606" font-weight="700">Cas inverse, une prodrogue :</text>
  <text x="72" y="630">la codéine est transformée en</text>
  <text x="72" y="654">morphine par le CYP2D6.</text>
  <text x="72" y="682">Avec un inhibiteur du CYP2D6,</text>
  <text x="72" y="706">comme la fluoxétine : moins de</text>
  <text x="72" y="728" font-weight="700" fill="#073f6e">morphine, effet diminué</text>
</svg>
