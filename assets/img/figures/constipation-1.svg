<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" font-family="'Atkinson Hyperlegible Next Variable', system-ui, sans-serif" font-size="16" fill="currentColor">
  <!-- Four steps, from the first thing to do to seeing a doctor -->
  <rect x="16" y="12" width="408" height="62" rx="10" fill="#e6f7ef" stroke="#0b6b45" stroke-width="2"/>
  <circle cx="44" cy="43" r="16" fill="none" stroke="#0b6b45" stroke-width="2.5"/>
  <text x="44" y="49" text-anchor="middle" font-weight="700" fill="#0b6b45">1</text>
  <text x="72" y="38" font-size="17" font-weight="700">D'abord</text>
  <text x="72" y="60">eau, fibres, activité</text>

  <rect x="44" y="82" width="380" height="62" rx="10" fill="#eef6fa" stroke="#073f6e" stroke-width="2"/>
  <circle cx="72" cy="113" r="16" fill="none" stroke="#073f6e" stroke-width="2.5"/>
  <text x="72" y="119" text-anchor="middle" font-weight="700" fill="#073f6e">2</text>
  <text x="100" y="108" font-size="17" font-weight="700">Si cela ne suffit pas</text>
  <text x="100" y="130">laxatif de lest ou osmotique</text>

  <rect x="72" y="152" width="352" height="62" rx="10" fill="#ffffff" stroke="#7a4f00" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="100" cy="183" r="16" fill="none" stroke="#7a4f00" stroke-width="2.5"/>
  <text x="100" y="189" text-anchor="middle" font-weight="700" fill="#7a4f00">3</text>
  <text x="128" y="178" font-size="17" font-weight="700">En cas d'échec</text>
  <text x="128" y="200">lubrifiant ou stimulant, peu de temps</text>

  <rect x="100" y="222" width="324" height="62" rx="10" fill="#fdeceb" stroke="#b3261e" stroke-width="2"/>
  <circle cx="128" cy="253" r="16" fill="none" stroke="#b3261e" stroke-width="2.5"/>
  <text x="128" y="259" text-anchor="middle" font-weight="700" fill="#b3261e">4</text>
  <text x="156" y="260" font-size="17" font-weight="700" fill="#b3261e">Puis consultez</text>
</svg>
