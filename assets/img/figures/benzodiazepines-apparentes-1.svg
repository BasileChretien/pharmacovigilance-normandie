<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 292" width="440" height="292" font-family="'Atkinson Hyperlegible Next Variable', system-ui, sans-serif" font-size="16" fill="#10283a">
  <!-- Axes -->
  <text x="16" y="24" fill="#46586a">Dose</text>
  <path d="M40 36 V256 H424" fill="none" stroke="#46586a" stroke-width="2" stroke-linecap="round"/>
  <text x="40" y="280" fill="#46586a">Semaines</text>

  <!-- The staircase: the dose goes down step by step -->
  <path d="M40 56 H108 V96 H168 V136 H312 V176 H360 V216 H404 V256 H40 Z" fill="#dcebf3"/>
  <path d="M40 56 H108 V96 H168 V136 H312 V176 H360 V216 H404 V256" fill="none" stroke="#073f6e" stroke-width="4" stroke-linejoin="round"/>

  <!-- The longer step -->
  <rect x="168" y="136" width="144" height="12" fill="#e7b03b"/>
  <path d="M176 118 H304" stroke="#10283a" stroke-width="2"/>
  <path d="M176 112 V124 M304 112 V124" stroke="#10283a" stroke-width="2"/>
  <text x="182" y="80" font-weight="700">En cas de gêne :</text>
  <text x="182" y="102">rester plus longtemps</text>

  <text x="404" y="280" text-anchor="middle" font-weight="700" fill="#073f6e">Arrêt</text>
</svg>
