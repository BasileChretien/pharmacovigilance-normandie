<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" width="440" height="340" font-family="'Atkinson Hyperlegible Next Variable', system-ui, sans-serif" font-size="16" fill="#10283a">
  <text x="16" y="22" font-size="17" font-weight="700">Gêne moyenne, score de 0 à 100</text>
  <text x="16" y="42" fill="#46586a">(axe coupé à 20)</text>

  <!-- Grid and axis: 10 units per point of score, baseline at 260 -->
  <g stroke="#d5e2ea" stroke-width="1.5">
    <line x1="60" y1="210" x2="424" y2="210"/><line x1="60" y1="160" x2="424" y2="160"/>
    <line x1="60" y1="110" x2="424" y2="110"/><line x1="60" y1="60" x2="424" y2="60"/>
  </g>
  <g text-anchor="end" fill="#46586a">
    <text x="50" y="265">0</text><text x="50" y="215">5</text><text x="50" y="165">10</text><text x="50" y="115">15</text><text x="50" y="65">20</text>
  </g>
  <line x1="60" y1="260" x2="424" y2="260" stroke="#46586a" stroke-width="2"/>

  <!-- Bars: 8.0, 15.4, 16.3 -->
  <rect x="84" y="180" width="80" height="80" fill="#ffffff" stroke="#073f6e" stroke-width="2.5"/>
  <rect x="202" y="106" width="80" height="154" fill="#dcebf3" stroke="#073f6e" stroke-width="2.5"/>
  <rect x="320" y="97" width="80" height="163" fill="#073f6e"/>
  <g text-anchor="middle" font-weight="700">
    <text x="124" y="170">8,0</text><text x="242" y="96">15,4</text><text x="360" y="87">16,3</text>
  </g>
  <g text-anchor="middle">
    <text x="124" y="284">Mois sans</text><text x="124" y="304">comprimé</text>
    <text x="242" y="284">Mois</text><text x="242" y="304">placebo</text>
    <text x="360" y="284">Mois</text><text x="360" y="304">statine</text>
  </g>
  <text x="16" y="332" fill="#46586a">Étude SAMSON, 49 personnes jusqu'au bout.</text>
</svg>
