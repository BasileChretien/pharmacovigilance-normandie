<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 600" width="440" height="600" font-family="'Atkinson Hyperlegible Next Variable', system-ui, sans-serif" font-size="16" fill="currentColor">
  <defs>
    <g id="ecraser-couper-1-croix">
      <circle r="13" fill="#ffffff" stroke="#b3261e" stroke-width="2.5"/>
      <path d="M-5.5 -5.5 L5.5 5.5 M5.5 -5.5 L-5.5 5.5" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/>
    </g>
    <marker id="ecraser-couper-1-fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#073f6e"/>
    </marker>
    <marker id="ecraser-couper-1-fleche-alerte" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b3261e"/>
    </marker>
  </defs>

  <!-- Column headers -->
  <text x="112" y="24" text-anchor="middle" font-size="18" font-weight="700">Entier</text>
  <text x="330" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#b3261e">Écrasé</text>
  <line x1="220" y1="40" x2="220" y2="588" stroke="#d5e2ea" stroke-width="2"/>

  <!-- 1. Prolonged release -->
  <rect x="8" y="40" width="424" height="30" rx="6" fill="#eef6fa"/>
  <text x="20" y="61" font-size="17" font-weight="700">1. Comprimé à libération prolongée</text>
  <rect x="62" y="88" width="100" height="44" rx="22" fill="#dcebf3" stroke="#46586a" stroke-width="2"/>
  <g fill="#073f6e">
    <circle cx="82" cy="104" r="3"/><circle cx="98" cy="116" r="3"/><circle cx="114" cy="100" r="3"/>
    <circle cx="128" cy="118" r="3"/><circle cx="144" cy="106" r="3"/><circle cx="104" cy="124" r="3"/>
    <circle cx="176" cy="96" r="3"/>
  </g>
  <path d="M160 104 L172 98" stroke="#073f6e" stroke-width="2" marker-end="url(#ecraser-couper-1-fleche)"/>
  <text x="112" y="158" text-anchor="middle">sort petit à petit,</text>
  <text x="112" y="178" text-anchor="middle">sur plusieurs heures</text>

  <path d="M282 132 Q330 84 378 132 Z" fill="#dcebf3" stroke="#46586a" stroke-width="2" stroke-linejoin="round"/>
  <g fill="#073f6e">
    <circle cx="306" cy="124" r="3"/><circle cx="320" cy="114" r="3"/><circle cx="336" cy="110" r="3"/>
    <circle cx="350" cy="120" r="3"/><circle cx="330" cy="126" r="3"/><circle cx="362" cy="128" r="3"/>
  </g>
  <g stroke="#b3261e" stroke-width="2.5" marker-end="url(#ecraser-couper-1-fleche-alerte)">
    <path d="M312 96 L300 80"/><path d="M330 92 V72"/><path d="M348 96 L360 80"/>
  </g>
  <use href="#ecraser-couper-1-croix" x="406" y="92"/>
  <text x="330" y="158" text-anchor="middle" font-weight="700" fill="#b3261e">toute la dose</text>
  <text x="330" y="178" text-anchor="middle" font-weight="700" fill="#b3261e">d'un coup</text>

  <!-- 2. Gastro-resistant -->
  <rect x="8" y="206" width="424" height="30" rx="6" fill="#eef6fa"/>
  <text x="20" y="227" font-size="17" font-weight="700">2. Comprimé gastro-résistant</text>
  <rect x="62" y="256" width="100" height="44" rx="22" fill="#dcebf3" stroke="#073f6e" stroke-width="7"/>
  <text x="112" y="326" text-anchor="middle">une enveloppe le protège</text>
  <text x="112" y="346" text-anchor="middle">de l'acide de l'estomac</text>

  <path d="M282 300 Q330 256 378 300 Z" fill="#dcebf3" stroke="#46586a" stroke-width="2" stroke-linejoin="round"/>
  <g fill="none" stroke="#073f6e" stroke-width="6" stroke-linecap="round">
    <path d="M276 262 q10 -10 22 -6"/><path d="M356 252 q12 2 18 12"/><path d="M262 296 q-2 -12 6 -20"/><path d="M386 284 q4 8 0 16"/>
  </g>
  <use href="#ecraser-couper-1-croix" x="406" y="258"/>
  <text x="330" y="326" text-anchor="middle" font-weight="700" fill="#b3261e">l'enveloppe</text>
  <text x="330" y="346" text-anchor="middle" font-weight="700" fill="#b3261e">est détruite</text>

  <!-- 3. Capsule with coated granules -->
  <rect x="8" y="374" width="424" height="30" rx="6" fill="#eef6fa"/>
  <text x="20" y="395" font-size="17" font-weight="700">3. Gélule à petits grains enrobés</text>
  <path d="M52 430 H86 V462 H52 a16 16 0 0 1 0 -32 Z" fill="#e7b03b" stroke="#10283a" stroke-width="2"/>
  <path d="M120 440 h28 a16 16 0 0 1 0 32 h-28 Z" fill="#ffffff" stroke="#10283a" stroke-width="2" transform="rotate(-18 120 456)"/>
  <g fill="#ffffff" stroke="#073f6e" stroke-width="2.5">
    <circle cx="96" cy="478" r="5"/><circle cx="110" cy="488" r="5"/><circle cx="124" cy="480" r="5"/>
    <circle cx="102" cy="496" r="5"/><circle cx="118" cy="502" r="5"/>
  </g>
  <text x="112" y="534" text-anchor="middle">on peut parfois</text>
  <text x="112" y="554" text-anchor="middle">l'ouvrir</text>

  <g fill="#ffffff" stroke="#073f6e" stroke-width="2.5">
    <circle cx="300" cy="490" r="5"/><circle cx="316" cy="496" r="5"/><circle cx="346" cy="492" r="5"/><circle cx="362" cy="486" r="5"/>
  </g>
  <path d="M318 488 l5 -4 l6 3 l5 -5 l6 4 l-2 8 h-18 Z" fill="#dcebf3" stroke="#46586a" stroke-width="1.5"/>
  <rect x="314" y="430" width="32" height="44" rx="8" fill="#dcebf3" stroke="#46586a" stroke-width="2" transform="rotate(12 330 452)"/>
  <use href="#ecraser-couper-1-croix" x="406" y="430"/>
  <text x="330" y="534" text-anchor="middle" font-weight="700" fill="#b3261e">les grains ne doivent</text>
  <text x="330" y="554" text-anchor="middle" font-weight="700" fill="#b3261e">pas être écrasés</text>
</svg>
