<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 448" width="440" height="448" font-family="'Atkinson Hyperlegible Next Variable', system-ui, sans-serif" font-size="16" fill="#10283a">
  <defs>
    <marker id="opioides-1-fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#073f6e"/>
    </marker>
  </defs>

  <!-- Brain -->
  <path d="M84 70 C72 44 98 22 122 30 C134 14 166 16 172 34 C196 30 210 52 198 70 C210 88 190 108 168 102 C156 116 120 116 110 102 C88 108 72 90 84 70 Z" fill="#dcebf3" stroke="#10283a" stroke-width="2"/>
  <path d="M112 56 q12 10 24 0 M146 64 q12 -10 26 2 M118 84 q16 -8 30 4" fill="none" stroke="#46586a" stroke-width="1.5"/>
  <text x="222" y="62" font-size="17" font-weight="700">Cerveau</text>

  <!-- Spinal cord -->
  <rect x="134" y="112" width="16" height="250" rx="8" fill="#dcebf3" stroke="#10283a" stroke-width="2"/>
  <g stroke="#46586a" stroke-width="2">
    <line x1="126" y1="140" x2="158" y2="140"/><line x1="126" y1="180" x2="158" y2="180"/><line x1="126" y1="220" x2="158" y2="220"/>
    <line x1="126" y1="260" x2="158" y2="260"/><line x1="126" y1="300" x2="158" y2="300"/>
  </g>
  <text x="174" y="200" font-size="17" font-weight="700">Moelle épinière</text>

  <!-- Nerve to the hand -->
  <path d="M150 330 C200 330 250 350 300 372 C320 381 336 386 350 388" fill="none" stroke="#10283a" stroke-width="3"/>
  <text x="206" y="326" font-size="17" font-weight="700">Nerf</text>
  <path d="M350 372 h28 a8 8 0 0 1 0 16 h-6 a6 6 0 0 1 0 12 h-22 Z" fill="#dcebf3" stroke="#10283a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M396 360 l4 9 l9 -3 l-5 8 l8 5 l-9 2 l2 9 l-7 -6 l-6 7 l0 -9 l-9 -1 l7 -6 l-5 -8 l9 2 Z" fill="#e7b03b" stroke="#b3261e" stroke-width="1.5"/>
  <text x="330" y="430" font-size="17" font-weight="700">Blessure</text>

  <!-- The message goes up -->
  <g stroke="#073f6e" stroke-width="3" fill="none" marker-end="url(#opioides-1-fleche)" stroke-dasharray="8 5">
    <path d="M330 396 C290 384 240 360 172 350"/>
    <path d="M112 340 V120"/>
  </g>
  <text x="16" y="250" fill="#073f6e" font-weight="700">Message</text>
  <text x="16" y="270" fill="#073f6e" font-weight="700">de douleur</text>

  <!-- Where the opioid blocks it -->
  <g stroke="#b3261e" stroke-width="7" stroke-linecap="round">
    <line x1="96" y1="160" x2="128" y2="160"/>
    <line x1="96" y1="112" x2="128" y2="112"/>
  </g>
  <rect x="226" y="96" width="198" height="64" rx="10" fill="#fdeceb" stroke="#b3261e" stroke-width="2"/>
  <text x="240" y="122" font-weight="700" fill="#b3261e">L'opioïde bloque</text>
  <text x="240" y="144">le message ici</text>
  <path d="M226 128 C190 128 160 140 132 158" fill="none" stroke="#b3261e" stroke-width="2"/>
  <path d="M226 116 C190 112 160 112 132 112" fill="none" stroke="#b3261e" stroke-width="2"/>
</svg>
