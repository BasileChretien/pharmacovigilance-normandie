<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 500" width="440" height="500" font-family="'Atkinson Hyperlegible Next Variable', system-ui, sans-serif" font-size="16" fill="currentColor">
  <defs>
    <marker id="anticoagulants-oraux-1-fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#073f6e"/>
    </marker>
  </defs>

  <!-- The chain of coagulation -->
  <rect x="16" y="12" width="408" height="68" rx="10" fill="#eef6fa"/>
  <path d="M28 40 C28 26 44 22 60 24 C72 26 78 32 76 42 C74 54 60 58 48 64 C38 68 28 58 28 40 Z" fill="#dcebf3" stroke="#10283a" stroke-width="2"/>
  <text x="88" y="40" font-weight="700">Le foie, avec la vitamine K,</text>
  <text x="88" y="64">fabrique les facteurs de la coagulation</text>

  <rect x="16" y="148" width="408" height="48" rx="10" fill="#eef6fa"/>
  <circle cx="52" cy="172" r="10" fill="#dcebf3" stroke="#10283a" stroke-width="2"/>
  <text x="88" y="178" font-weight="700">Facteur Xa</text>

  <rect x="16" y="264" width="408" height="48" rx="10" fill="#eef6fa"/>
  <circle cx="52" cy="288" r="10" fill="#dcebf3" stroke="#10283a" stroke-width="2"/>
  <text x="88" y="294" font-weight="700">Thrombine</text>

  <rect x="16" y="380" width="408" height="108" rx="10" fill="#ffffff" stroke="#46586a" stroke-width="1.5"/>
  <g stroke="#46586a" stroke-width="1.5">
    <path d="M28 400 L88 470 M40 470 L84 396 M24 436 L92 432 M30 412 L80 460"/>
  </g>
  <g fill="#fdeceb" stroke="#b3261e" stroke-width="2">
    <circle cx="44" cy="424" r="8"/><circle cx="66" cy="414" r="8"/><circle cx="58" cy="446" r="8"/><circle cx="76" cy="440" r="8"/><circle cx="44" cy="458" r="8"/>
  </g>
  <text x="112" y="420" font-weight="700">Caillot</text>
  <text x="112" y="444">Sous anticoagulant,</text>
  <text x="112" y="466">il se forme moins vite.</text>

  <!-- Arrows, each blocked by a medicine -->
  <g stroke="#073f6e" stroke-width="2.5" marker-end="url(#anticoagulants-oraux-1-fleche)">
    <line x1="52" y1="80" x2="52" y2="144"/>
    <line x1="52" y1="196" x2="52" y2="260"/>
    <line x1="52" y1="312" x2="52" y2="376"/>
  </g>
  <g stroke="#b3261e" stroke-width="6" stroke-linecap="round">
    <line x1="36" y1="112" x2="68" y2="112"/>
    <line x1="36" y1="228" x2="68" y2="228"/>
    <line x1="36" y1="344" x2="68" y2="344"/>
  </g>
  <g font-weight="700">
    <rect x="88" y="98" width="52" height="28" rx="6" fill="#b3261e"/><text x="114" y="118" text-anchor="middle" fill="#ffffff">AVK</text>
    <rect x="88" y="214" width="52" height="28" rx="6" fill="#b3261e"/><text x="114" y="234" text-anchor="middle" fill="#ffffff">AOD</text>
    <rect x="88" y="330" width="52" height="28" rx="6" fill="#b3261e"/><text x="114" y="350" text-anchor="middle" fill="#ffffff">AOD</text>
  </g>
  <text x="152" y="118">agissent contre la vitamine K</text>
  <text x="152" y="234">bloquent le facteur Xa</text>
  <text x="152" y="350">ou bloquent la thrombine</text>
</svg>
