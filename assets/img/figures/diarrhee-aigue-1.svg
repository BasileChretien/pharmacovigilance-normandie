<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 396" width="440" height="396" font-family="'Atkinson Hyperlegible Next Variable', system-ui, sans-serif" font-size="16" fill="currentColor">
  <!-- 1. One sachet in 200 ml of water -->
  <rect x="16" y="12" width="120" height="116" rx="10" fill="#eef6fa"/>
  <path d="M54 52 H82 V118 a4 4 0 0 1 -4 4 H58 a4 4 0 0 1 -4 -4 Z" fill="#ffffff" stroke="#10283a" stroke-width="2"/>
  <path d="M55 70 H81 V118 a3 3 0 0 1 -3 3 H58 a3 3 0 0 1 -3 -3 Z" fill="#bfe3ee"/>
  <path d="M54 52 H82 V118 a4 4 0 0 1 -4 4 H58 a4 4 0 0 1 -4 -4 Z" fill="none" stroke="#10283a" stroke-width="2"/>
  <path d="M60 52 V46 H76 V52 M64 46 a4 6 0 0 1 8 0" fill="#ffffff" stroke="#10283a" stroke-width="2"/>
  <path d="M82 70 H88 M82 86 H86 M82 102 H86" stroke="#10283a" stroke-width="1.5"/>
  <g transform="rotate(30 108 34)">
    <rect x="96" y="20" width="24" height="30" rx="2" fill="#ffffff" stroke="#10283a" stroke-width="2"/>
    <path d="M96 26 H120" stroke="#46586a" stroke-width="1.5"/>
  </g>
  <g fill="#46586a"><circle cx="94" cy="56" r="1.6"/><circle cx="90" cy="62" r="1.6"/><circle cx="86" cy="58" r="1.6"/></g>
  <text x="152" y="44" font-size="17" font-weight="700">Un sachet</text>
  <text x="152" y="66">dans 200 ml d'eau</text>
  <text x="152" y="90" fill="#46586a">trait du biberon : 200 ml</text>

  <!-- 2. Small amounts, often; if the child vomits, a teaspoon first -->
  <rect x="16" y="140" width="120" height="116" rx="10" fill="#eef6fa"/>
  <circle cx="56" cy="198" r="26" fill="#ffffff" stroke="#10283a" stroke-width="2"/>
  <circle cx="48" cy="190" r="2.2" fill="#10283a"/><circle cx="64" cy="190" r="2.2" fill="#10283a"/>
  <ellipse cx="62" cy="208" rx="5" ry="4" fill="#10283a"/>
  <line x1="74" y1="212" x2="120" y2="230" stroke="#46586a" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="74" cy="211" rx="7" ry="4" transform="rotate(20 74 211)" fill="#bfe3ee" stroke="#10283a" stroke-width="1.8"/>
  <g fill="#073f6e">
    <rect x="94" y="168" width="6" height="8"/><rect x="104" y="162" width="6" height="14"/><rect x="114" y="154" width="6" height="22"/>
  </g>
  <text x="152" y="172" font-size="17" font-weight="700">Par petites quantités,</text>
  <text x="152" y="194" font-size="17" font-weight="700">souvent</text>
  <text x="152" y="218">s'il vomit : une cuillère à café,</text>
  <text x="152" y="240">puis augmentez peu à peu</text>

  <!-- 3. In the fridge, 24 hours at most -->
  <rect x="16" y="268" width="120" height="116" rx="10" fill="#eef6fa"/>
  <rect x="44" y="280" width="64" height="94" rx="6" fill="#ffffff" stroke="#10283a" stroke-width="2"/>
  <path d="M44 310 H108 M98 288 V302 M98 318 V340" stroke="#10283a" stroke-width="2" stroke-linecap="round"/>
  <path d="M62 324 H76 V366 H62 Z" fill="#bfe3ee" stroke="#10283a" stroke-width="1.8"/>
  <path d="M66 324 V318 H72 V324" fill="#ffffff" stroke="#10283a" stroke-width="1.8"/>
  <text x="152" y="300" font-size="17" font-weight="700">Au réfrigérateur,</text>
  <text x="152" y="322" font-size="17" font-weight="700">24 heures au plus</text>
  <text x="152" y="346">une fois préparé</text>
</svg>
