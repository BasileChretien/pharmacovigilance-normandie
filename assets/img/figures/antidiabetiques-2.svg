<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 448" width="440" height="448" font-family="'Atkinson Hyperlegible Next Variable', system-ui, sans-serif" font-size="16" fill="currentColor">
  <text x="16" y="24" font-size="17" font-weight="700">Les signes</text>

  <!-- Silhouette -->
  <circle cx="220" cy="70" r="24" fill="#dcebf3" stroke="#10283a" stroke-width="2"/>
  <path d="M180 220 V132 a40 30 0 0 1 80 0 V220 Z" fill="#dcebf3" stroke="#10283a" stroke-width="2"/>
  <!-- Sweat drops -->
  <g fill="#19a6e3" stroke="#10283a" stroke-width="1.2">
    <path d="M190 60 q-5 8 0 11 q5 -3 0 -11 Z"/><path d="M250 56 q-5 8 0 11 q5 -3 0 -11 Z"/>
  </g>
  <!-- Heart -->
  <path d="M214 146 a6 6 0 0 1 12 0 a6 6 0 0 1 12 0 q0 10 -12 18 q-12 -8 -12 -18 Z" transform="translate(-14 0)" fill="#fdeceb" stroke="#b3261e" stroke-width="2"/>
  <!-- Trembling hand -->
  <path d="M268 176 l6 -5 l6 5 l6 -5 l6 5" fill="none" stroke="#10283a" stroke-width="2"/>

  <!-- Labels around -->
  <g stroke="#46586a" stroke-width="1.5">
    <line x1="112" y1="66" x2="184" y2="66"/>
    <line x1="296" y1="48" x2="242" y2="60"/>
    <line x1="112" y1="182" x2="200" y2="190"/>
    <line x1="296" y1="122" x2="236" y2="150"/>
    <line x1="300" y1="188" x2="292" y2="178"/>
  </g>
  <text x="16" y="72" font-weight="700">Sueurs</text>
  <text x="300" y="54" font-weight="700">Confusion</text>
  <text x="16" y="188" font-weight="700">Faim</text>
  <text x="300" y="116" font-weight="700">Cœur qui</text>
  <text x="300" y="136" font-weight="700">bat vite</text>
  <text x="304" y="206" font-weight="700">Tremblements</text>

  <!-- What to take -->
  <line x1="16" y1="244" x2="424" y2="244" stroke="#d5e2ea" stroke-width="2"/>
  <text x="16" y="274" font-size="17" font-weight="700">Que prendre ?</text>

  <!-- Sugar -->
  <rect x="16" y="288" width="132" height="148" rx="10" fill="#e6f7ef" stroke="#0b6b45" stroke-width="2"/>
  <g stroke="#10283a" stroke-width="2" stroke-linejoin="round">
    <path d="M62 318 L82 308 L102 318 L82 328 Z" fill="#ffffff"/>
    <path d="M62 318 V340 L82 350 V328 Z" fill="#eef6fa"/>
    <path d="M82 328 V350 L102 340 V318 Z" fill="#dcebf3"/>
  </g>
  <text x="82" y="384" text-anchor="middle" font-weight="700" fill="#0b6b45">Oui</text>
  <text x="82" y="408" text-anchor="middle">du sucre</text>

  <!-- Sweet drink -->
  <rect x="154" y="288" width="132" height="148" rx="10" fill="#e6f7ef" stroke="#0b6b45" stroke-width="2"/>
  <path d="M206 306 H234 L230 352 H210 Z" fill="#ffffff" stroke="#10283a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M207.3 322 H232.7 L230 352 H210 Z" fill="#e7b03b"/>
  <path d="M206 306 H234 L230 352 H210 Z" fill="none" stroke="#10283a" stroke-width="2" stroke-linejoin="round"/>
  <text x="220" y="384" text-anchor="middle" font-weight="700" fill="#0b6b45">Oui</text>
  <text x="220" y="408" text-anchor="middle">une boisson</text>
  <text x="220" y="428" text-anchor="middle">sucrée</text>

  <!-- Sweetener: no -->
  <rect x="292" y="288" width="132" height="148" rx="10" fill="#fdeceb" stroke="#b3261e" stroke-width="2"/>
  <rect x="340" y="306" width="36" height="46" rx="4" fill="#ffffff" stroke="#10283a" stroke-width="2"/>
  <circle cx="352" cy="324" r="3" fill="#46586a"/><circle cx="364" cy="334" r="3" fill="#46586a"/><circle cx="352" cy="340" r="3" fill="#46586a"/>
  <line x1="328" y1="356" x2="388" y2="302" stroke="#b3261e" stroke-width="4" stroke-linecap="round"/>
  <text x="358" y="384" text-anchor="middle" font-weight="700" fill="#b3261e">Non</text>
  <text x="358" y="408" text-anchor="middle">un édulcorant</text>
  <text x="358" y="428" text-anchor="middle">sucre de régime</text>
</svg>
