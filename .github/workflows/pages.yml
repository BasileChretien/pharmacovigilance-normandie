name: pages

# Builds the site and publishes it on GitHub Pages at each push to main.
# The pages keep their noindex meta tag: the prototype is shareable by link, not indexed.

on:
  push:
    branches: [main]
  # Mondays: rebuilds the site so the official alerts feed is read again
  # (actualites/posts/alertes-officielles.qmd). GitHub pauses schedules after 60 days
  # without activity on the repository: re-enable it from the Actions tab.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"
      # Reads the ANSM and EMA pages again. A site that does not answer keeps the list
      # committed in data/alertes.json, with its own date, and the run shows a warning.
      - name: Refresh the official alerts feed
        run: |
          python3 tools/build/fetch_alertes.py || echo "::warning::Official alerts feed: a site did not answer; its previous list is kept."
          python3 tools/build/make_alertes_page.py
      # The post-render script (tools/build/search_postprocess.py) uses the runner's python3.
      - name: Render the site
        run: quarto render
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
