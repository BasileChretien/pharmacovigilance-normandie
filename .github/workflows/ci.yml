name: checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  checks:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
      # Before pytest: tests/test_page_meta_filter.py runs the filter through Quarto, and
      # fails rather than skips when Quarto is missing in CI.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"
      - name: Tests of the checks
        run: uv run pytest -q
      - name: Writing and front-matter rules
        run: uv run python tools/checks/check_content.py --quiet
      - name: Colour contrast
        run: uv run python tools/checks/check_contrast.py
      - name: Figures (SVG files and their placement)
        run: uv run python tools/checks/check_figures.py

      - name: Render the site
        run: quarto render
      - name: Every section listed in its table of contents
        run: uv run python tools/checks/check_toc.py

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: JavaScript tests
        run: npm run test:js
      - name: HTML validity
        run: |
          npm install
          npm run check:html
      - name: Accessibility (axe-core)
        run: |
          npm install --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium
          npm run check:a11y
      # Phone layout (docs/mobile.md): WebKit at 320 and 390 px, Chromium at 412 px, light
      # and dark. Uses the playwright installed by the axe step; the browser tests are
      # skipped by npm run test:js, which runs before it.
      - name: Phone layout
        id: mobile
        run: |
          npx playwright install --with-deps webkit
          node --test tests/js/check-mobile-browser.test.mjs
          npm run check:mobile
      - name: Screenshots of the phone-layout failures
        if: failure() && steps.mobile.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: captures-mobile
          path: _captures-mobile/
          if-no-files-found: ignore
          retention-days: 14
