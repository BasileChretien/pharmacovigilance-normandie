project:
  type: website
  output-dir: _site
  resources:
    - assets/js/
    - assets/img/
    - assets/fonts/
    - assets/data/
  post-render:
    - tools/build/search_postprocess.py
  render:
    - "*.qmd"
    - "!_templates/"
    - "!docs/"
    - "!README.md"
    - "!CLAUDE.md"

lang: fr

# {{< figure-svg nom alt="…" legende="…" >}}: inlines assets/img/figures/nom.svg (docs/regles-redaction.md §5).
shortcodes:
  - assets/filters/figure-svg.lua

website:
  title: "Pharmacovigilance Normandie"
  # Needed for the 404 page, whose links Quarto makes absolute (it is served at any address).
  site-url: "https://basilechretien.github.io/pharmacovigilance-normandie/"
  description: "Information sur les médicaments par les centres régionaux de pharmacovigilance de Caen et de Rouen (prototype)."
  favicon: assets/img/favicon.svg
  search:
    location: navbar
    type: overlay
    keyboard-shortcut: []
  announcement:
    content: "**Prototype non officiel** : brouillons en cours de relecture, à ne pas utiliser pour une décision de soin. [Signaler une correction](mailto:pharmacovigilance@chu-caen.fr?subject=Prototype%20Pharmacovigilance%20Normandie%20%3A%20correction){.signaler-correction}"
    type: warning
    dismissable: false
    position: below-navbar
  navbar:
    title: "Pharmacovigilance Normandie"
    logo: assets/img/logo-mark.svg
    logo-alt: "Accueil Pharmacovigilance Normandie"
    collapse-below: xl
    left:
      - text: "Médicaments"
        href: medicaments/index.qmd
      - text: "Bon usage"
        href: bon-usage/index.qmd
      - text: "Comprendre"
        href: comprendre/index.qmd
      - text: "Vigiking"
        href: vigiking/index.qmd
      - text: "Actualités"
        href: actualites/index.qmd
      - text: "En Normandie"
        href: normandie/index.qmd
    right:
      - text: "Les CRPV"
        href: crpv/index.qmd
      - text: "Déclarer"
        href: declarer.qmd
      - text: "Poser une question"
        href: poser-une-question.qmd
      # One page for English-speaking visitors, not a translated site: said in the label.
      - text: "In English"
        href: normandie/en/index.qmd
  page-footer:
    left: |
      **Pharmacovigilance Normandie**, de la Hague au pays de Bray.  
      **Urgence vitale** : [15](tel:15) ou [112](tel:112). **Intoxication** : centre antipoison d'Angers, [02 41 48 21 21](tel:+33241482121)  
      **CRPV de Caen** (Calvados, Manche, Orne) : [02 31 06 46 72](tel:+33231064672)  
      **CRPV de Rouen** (Eure, Seine-Maritime) : [02 32 88 90 79](tel:+33232889079)  
      Prototype non officiel.
    center: |
      ![Logo du CRPV Normandie Caen](/assets/img/logos/crpv-caen.png){.logo-partenaire} ![Logo du CHU de Caen Normandie](/assets/img/logos/chu-caen-normandie.png){.logo-partenaire} ![Logo du CHU de Rouen Normandie](/assets/img/logos/chu-rouen.png){.logo-partenaire}
    right:
      - text: "Politique éditoriale"
        href: a-propos/politique-editoriale.qmd
      - text: "Mentions légales"
        href: a-propos/mentions-legales.qmd
      - text: "Accessibilité"
        href: a-propos/accessibilite.qmd
      - text: "In English (visitors)"
        href: normandie/en/index.qmd
  back-to-top-navigation: false
  page-navigation: false

format:
  html:
    theme:
      - default
      - assets/theme.scss
    css: assets/fonts/fonts.css
    title-block-banner: true
    toc: true
    toc-title: "Sur cette page"
    toc-location: right
    smooth-scroll: true
    link-external-icon: true
    link-external-newwindow: false
    anchor-sections: true
    code-copy: false
    include-in-header:
      - text: |
          <meta name="robots" content="noindex, nofollow">
    include-after-body:
      - text: |
          <script>
          // The navbar toggle opens a disclosure, not an ARIA menu (user panel, round 2).
          document.querySelectorAll(".navbar-toggler[role='menu']").forEach(function (b) { b.removeAttribute("role"); });
          // "In English" is English text in a French page (RGAA 8.7).
          document.querySelectorAll("a[href*='normandie/en/']").forEach(function (a) {
            if (/^In English/.test(a.textContent.trim())) { a.setAttribute("lang", "en"); }
          });
          // The correction email carries the address of the page being read.
          document.querySelectorAll("a.signaler-correction").forEach(function (a) {
            a.href += "&body=" + encodeURIComponent("Page : " + window.location.href + "\n\nCorrection proposée :\n");
          });
          </script>
    include-before-body:
      - text: |
          <a class="lien-evitement" href="#quarto-document-content">Aller au contenu</a>
    filters:
      - assets/filters/page-meta.lua
      # The annotated SmPC of comprendre/lire-un-rcp.qmd: sections as disclosures.
      - assets/filters/rcp-annote.lua
