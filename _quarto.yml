project:
  type: website
  output-dir: _site
  resources:
    - assets/js/
    - assets/img/
    - assets/fonts/
  post-render:
    - tools/build/search_postprocess.py
  render:
    - "*.qmd"
    - "!_templates/"
    - "!docs/"
    - "!README.md"
    - "!CLAUDE.md"

lang: fr

website:
  title: "Pharmacovigilance Normandie"
  description: "Information sur les médicaments par les centres régionaux de pharmacovigilance de Caen et de Rouen (prototype)."
  favicon: assets/img/favicon.svg
  search:
    location: navbar
    type: overlay
    keyboard-shortcut: []
  announcement:
    content: "**Prototype non officiel** : brouillons en cours de relecture, à ne pas utiliser pour une décision de soin."
    type: warning
    dismissable: false
    position: below-navbar
  navbar:
    title: "Pharmacovigilance Normandie"
    logo: assets/img/logo-mark.svg
    logo-alt: "Accueil Pharmacovigilance Normandie"
    collapse-below: xxl
    left:
      - text: "Médicaments"
        href: medicaments/index.qmd
      - text: "Bon usage"
        href: bon-usage/index.qmd
      - text: "Comprendre"
        href: comprendre/index.qmd
      - text: "Vigiking"
        href: vigiking/index.qmd
      - text: "Actualités"
        href: actualites/index.qmd
      - text: "En Normandie"
        href: normandie/index.qmd
    right:
      - text: "English"
        href: normandie/en/index.qmd
      - text: "Les CRPV"
        href: crpv/index.qmd
      - text: "Déclarer"
        href: declarer.qmd
      - text: "Poser une question"
        href: poser-une-question.qmd
  page-footer:
    left: |
      **CRPV de Caen** (Calvados, Manche, Orne) : [02 31 06 46 72](tel:+33231064672)  
      **CRPV de Rouen** (Eure, Seine-Maritime) : [02 32 88 90 79](tel:+33232889079)  
      Prototype non officiel.
    center: |
      ![Logo du CRPV Normandie Caen](/assets/img/logos/crpv-caen.png){.logo-partenaire} ![Logo du CHU de Caen Normandie](/assets/img/logos/chu-caen-normandie.png){.logo-partenaire} ![Logo du CHU de Rouen Normandie](/assets/img/logos/chu-rouen.png){.logo-partenaire}
    right:
      - text: "Politique éditoriale"
        href: a-propos/politique-editoriale.qmd
      - text: "Mentions légales"
        href: a-propos/mentions-legales.qmd
      - text: "Accessibilité"
        href: a-propos/accessibilite.qmd
      - text: "English"
        href: normandie/en/index.qmd
  back-to-top-navigation: false
  page-navigation: false

format:
  html:
    theme:
      - default
      - assets/theme.scss
    css: assets/fonts/fonts.css
    title-block-banner: true
    toc: true
    toc-title: "Sur cette page"
    toc-location: right
    smooth-scroll: true
    link-external-icon: true
    link-external-newwindow: false
    anchor-sections: true
    code-copy: false
    include-in-header:
      - text: |
          <meta name="robots" content="noindex, nofollow">
    include-after-body:
      - text: |
          <script>
          // The navbar toggle opens a disclosure, not an ARIA menu (user panel, round 2).
          document.querySelectorAll(".navbar-toggler[role='menu']").forEach(function (b) { b.removeAttribute("role"); });
          </script>
    include-before-body:
      - text: |
          <a class="lien-evitement" href="#quarto-document-content">Aller au contenu</a>
    filters:
      - assets/filters/page-meta.lua
