# Text/background pairs used on the site, checked against WCAG 2.1 AA:
# 4.5:1 for body text, 3:1 for large text and interface elements.
# pv-cyan and pv-green are decorative only (logo colours) and never carry text.
paires:
  - { texte: pv-ink, fond: pv-paper, minimum: 4.5, usage: "texte courant" }
  - { texte: pv-ink, fond: pv-mist, minimum: 4.5, usage: "texte des bandeaux (titre, accueil, pied de page)" }
  - { texte: pv-ink-quiet, fond: pv-paper, minimum: 4.5, usage: "texte secondaire" }
  - { texte: pv-ink-quiet, fond: pv-mist, minimum: 4.5, usage: "chapô et texte secondaire sur bandeau" }
  - { texte: pv-signal, fond: pv-paper, minimum: 4.5, usage: "liens, bouton Poser une question" }
  - { texte: pv-signal, fond: pv-mist, minimum: 4.5, usage: "liens sur bandeau" }
  - { texte: pv-paper, fond: pv-signal, minimum: 4.5, usage: "bouton Déclarer" }
  - { texte: pv-paper, fond: pv-signal-dark, minimum: 4.5, usage: "bouton Déclarer au survol" }
  - { texte: pv-signal-dark, fond: pv-mist, minimum: 4.5, usage: "menu actif, onglet actif" }
  - { texte: pv-green-ink, fond: pv-green-tint, minimum: 4.5, usage: "titre de l'encadré À retenir" }
  - { texte: pv-ink, fond: pv-green-tint, minimum: 4.5, usage: "texte de l'encadré À retenir" }
  - { texte: pv-alert, fond: pv-alert-tint, minimum: 4.5, usage: "titre de l'encadré Quand consulter, bandeau urgence" }
  - { texte: pv-ink, fond: pv-alert-tint, minimum: 4.5, usage: "texte de l'encadré Quand consulter, numéros d'urgence" }
  - { texte: pv-ink-quiet, fond: pv-alert-tint, minimum: 4.5, usage: "libellés du bandeau urgence" }
  - { texte: pv-signal, fond: pv-alert-tint, minimum: 4.5, usage: "lien du bandeau urgence" }
  - { texte: pv-amber, fond: pv-amber-tint, minimum: 4.5, usage: "bandeau prototype, statut brouillon" }
  - { texte: pv-signal, fond: pv-rule, minimum: 3.0, usage: "bordure du champ de recherche au survol (élément d'interface)" }
