title: Vigiking Normand
author: CRPV de Caen et de Rouen
version: 0.1.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    # PDF to attach to the email: 16:9 pages, as the PowerPoint version.
    typst:
      template-partials:
        - typst-template.typ
        - typst-show.typ
      filters:
        - vigiking.lua
      fig-cap-location: bottom
    # Web version of the same issue.
    html:
      filters:
        - vigiking.lua
      css: vigiking.css
      toc: true
      toc-title: Sommaire
      toc-depth: 2
      embed-resources: true
      format-links: false   # the filter links the PDF (front matter pdf:)
      lang: fr
