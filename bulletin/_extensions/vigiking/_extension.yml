title: Vigiking Normand
author: CRPV de Caen et de Rouen
version: 0.2.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    # PDF to attach to the email: 16:9 pages, for reading on screen.
    typst:
      template-partials:
        - typst-template.typ
        - typst-show.typ
        - reseau.typ          # the network map, generated by tools/design/make_bulletin_reseau.py
        - mascotte.typ        # the site's mascot, generated by tools/design/make_bulletin_mascotte.py
      filters:
        - vigiking.lua
      font-paths:
        - fonts               # Atkinson Hyperlegible Next and Bricolage Grotesque (OFL)
      keep-typ: true          # the build's checks read each article's measure from it
      fig-cap-location: bottom
    # Web version of the same issue.
    html:
      filters:
        - vigiking.lua
      css: vigiking.css
      title-block-style: none # the cover is built by vigiking.lua
      toc: true
      toc-title: Sommaire
      toc-depth: 2
      embed-resources: true
      format-links: false     # the cover links the PDF (front matter pdf:)
      lang: fr
