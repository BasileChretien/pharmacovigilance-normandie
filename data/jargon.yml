# Medical terms that must be replaced or explained in brackets at their first
# appearance in a patient text. Format: term: plain-language proposal.
# Maintained by the editorial committee; used by tools/checks/check_content.py.
anticoagulant: "médicament qui rend le sang plus fluide"
antalgique: "médicament contre la douleur"
antiagrégant: "médicament qui empêche les plaquettes de former un caillot"
arythmie: "battements irréguliers du cœur"
asthénie: "grande fatigue"
bradycardie: "cœur qui bat trop lentement"
céphalée: "mal de tête"
contre-indication: "situation où le médicament ne doit pas être utilisé"
dyspnée: "essoufflement"
embolie: "caillot qui bouche un vaisseau sanguin"
érythème: "rougeur de la peau"
hématome: "bleu"
hémorragie: "saignement"
hépatique: "du foie"
hépatotoxicité: "atteinte du foie"
hypertension: "tension artérielle trop élevée"
hypotension: "tension artérielle trop basse"
hypoglycémie: "baisse du sucre dans le sang"
hyperkaliémie: "excès de potassium dans le sang"
hypokaliémie: "manque de potassium dans le sang"
hyponatrémie: "manque de sel dans le sang"
iatrogénie: "effets indésirables dus aux médicaments"
insuffisance rénale: "reins qui fonctionnent mal"
insuffisance hépatique: "foie qui fonctionne mal"
neuropathie: "atteinte des nerfs"
néphrotoxicité: "atteinte des reins"
œdème: "gonflement"
ostéoporose: "fragilité des os"
posologie: "dose et rythme de prise"
prurit: "démangeaisons"
rénal: "des reins"
rhabdomyolyse: "destruction des muscles"
syndrome sérotoninergique: "excès de sérotonine, avec agitation, fièvre et tremblements"
tachycardie: "cœur qui bat trop vite"
tendinopathie: "atteinte d'un tendon"
tératogène: "qui peut provoquer des malformations chez le bébé"
thrombose: "caillot dans un vaisseau sanguin"
ulcère: "plaie de l'estomac ou de l'intestin"
